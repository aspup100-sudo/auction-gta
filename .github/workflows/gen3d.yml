# 제미나이 그림 → 3D (무료 Hugging Face Space 호출). gen3d 브랜치에서만 돈다. 게임 배포와 무관.
name: Gen3D
on:
  push:
    branches: [gen3d]
    paths: ['gen3d/run.txt']
permissions:
  contents: write
concurrency:
  group: gen3d
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q gradio_client
      - run: python gen3d/gen.py
        continue-on-error: true
      - name: commit results
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add gen3d/out && git commit -m "gen3d: results [skip ci]" && git pull --rebase origin gen3d && git push origin HEAD:gen3d || echo nothing
