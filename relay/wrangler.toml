# 경매 GTA 중계 서버 설정. 배포: GitHub Actions(.github/workflows/relay.yml)가 `wrangler deploy`를 돌린다.
name = "auction-gta-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ChannelRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelRoom"]
